  <header>
    <div class="logo">
      FastandFreshEats
      <img src="logo.png" alt="Fast & Fresh Eats Logo" class="logo-img">

    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>

  </header>

  <section class="contact">
    <h1>Contact Us</h1>
    <p>Have questions, feedback, or just want to say hello? We'd love to hear from you!</p>

    <form id="contactForm" class="card" style="max-width: 600px; margin: 0 auto;">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Your Name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="message">Message:</label>
      <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>

      <button type="submit" class="btn">Send Message</button>
      <p id="formStatus" style="margin-top: 10px;"></p>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 FastandFreshEats | All Rights Reserved</p>
  </footer>

</body>
